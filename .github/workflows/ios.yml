name: iOS → TestFlight

# Builds the Expo app on a macOS runner, signs it with an App Store Connect API
# key (automatic signing, no certificates to export) and uploads it to TestFlight.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/game-core/**'
      - '.github/workflows/ios.yml'

concurrency:
  group: ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      APP_DIR: apps/mobile
      SCHEME: Bombarossa
      EXPO_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=0
          for name in TEAM_ID KEY_ID ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret for $name (expected repository secret: $( [ $name = TEAM_ID ] && echo APPLE_TEAM_ID || ([ $name = KEY_ID ] && echo ASC_KEY_ID || ([ $name = ISSUER_ID ] && echo ASC_ISSUER_ID || echo ASC_KEY_P8)) ))"
              missing=1
            fi
          done
          exit $missing

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run game-core tests
        run: npm test

      - name: Generate native iOS project (also runs pod install)
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform ios --clean

      - name: Set build number (TestFlight needs a new one on every upload)
        working-directory: ${{ env.APP_DIR }}
        run: /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/${{ env.SCHEME }}/Info.plist

      - name: Write App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8 }}" > ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Archive
        working-directory: ${{ env.APP_DIR }}/ios
        run: |
          xcodebuild archive \
            -workspace "$SCHEME.xcworkspace" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic

      - name: Export and upload to TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Print distribution logs on failure
        if: failure()
        run: |
          find "$TMPDIR" -maxdepth 2 -name '*.xcdistributionlogs' 2>/dev/null | while read -r d; do
            echo "=== $d"
            tail -n 120 "$d/IDEDistribution.standard.log" 2>/dev/null
          done

      - name: Remove API key
        if: always()
        run: rm -f ~/private_keys/AuthKey_*.p8
