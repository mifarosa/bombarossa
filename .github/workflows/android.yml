name: Android APK

# Builds an installable APK (signed with the debug key, fine for sideloading) and
# uploads it as a workflow artifact. Download it from the run page, copy it to the
# phone and open it (Android asks to allow installs from unknown sources once).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/game-core/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_DIR: apps/mobile
      EXPO_PUBLIC_SERVER_URL: ${{ vars.SERVER_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate native Android project
        working-directory: ${{ env.APP_DIR }}
        run: npx expo prebuild --platform android --clean

      - name: Set version code (a new install must have a higher one)
        working-directory: ${{ env.APP_DIR }}
        run: sed -i -E "0,/versionCode [0-9]+/s//versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Build release APK
        working-directory: ${{ env.APP_DIR }}/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bombarossa-android-${{ github.run_number }}
          path: ${{ env.APP_DIR }}/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
